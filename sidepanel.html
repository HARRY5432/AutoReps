<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body{font-family:system-ui;width:360px;margin:0;padding:14px;background:#0f0f14;color:#eee}
h2{margin:0 0 8px;font-size:18px;color:#a78bfa}
textarea{width:100%;height:70px;border-radius:10px;padding:10px;background:#1c1c26;color:#fff;border:1px solid #333}
button{background:#7c3aed;color:#fff;border:0;border-radius:10px;padding:9px 12px;margin:4px 2px;cursor:pointer;font-weight:600}
button.secondary{background:#262633}
button:hover{filter:brightness(1.15)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
input,select{width:100%;padding:7px;border-radius:8px;background:#1c1c26;color:#fff;border:1px solid #333;margin:3px 0}
#log{background:#000;border-radius:10px;padding:10px;height:220px;overflow:auto;font-size:12px;white-space:pre-wrap;margin-top:8px;border:1px solid #333}
details{margin-top:8px;font-size:13px}
summary{cursor:pointer;color:#a78bfa}
.badge{font-size:11px;color:#888}
</style>
</head>
<body>
<h2>🤖 AutoRep Autopilot</h2>
<div class="badge">plain english → does it on any site • BYOK</div>
<textarea id="task" placeholder='e.g. search laptop under 50k and extract top 5'></textarea>
<div class="row">
<button id="run">▶ Run</button>
<button id="stop" class="secondary" disabled>■ Stop</button>
<button id="scan" class="secondary">👁 Scan</button>
<button id="badges" class="secondary"># Badges</button>
<button id="extract" class="secondary">📄 Extract</button>
</div>
<div id="log">ready. open any website then Scan.\n</div>
<details>
<summary>⚙ AI Settings (agnostic - any model)</summary>
<label>Provider</label>
<select id="provider">
<option value="openai">OpenAI</option>
<option value="gemini">Gemini</option>
<option value="anthropic">Anthropic (via OpenRouter recommended)</option>
<option value="groq">Groq</option>
<option value="openrouter">OpenRouter</option>
<option value="ollama">Ollama local (no key)</option>
<option value="custom">Custom OpenAI-compatible</option>
</select>
<label>Base URL (auto unless custom)</label>
<input id="baseURL" placeholder="https://api.openai.com/v1">
<label>API Key</label>
<input id="apiKey" type="password" placeholder="sk-...">
<label>Model</label>
<input id="model" placeholder="gpt-4o-mini / gemini-1.5-flash / llama3.1">
<button id="save">💾 Save</button>
</details>
<script src="lib/ai-provider.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
